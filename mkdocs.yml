site_name: Parils
site_description: Parallel automated algorithm configuration via Iterated Local Search
repo_url: https://github.com/deeper4ai/parils
repo_name: deeper4ai/parils

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage:
    - CLI: usage/cli.md
    - Python: usage/python.md
  - Reference:
    - Parameter file: reference/params.md
    - Solver protocol: reference/protocol.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
